services:
  fastapi:
    build:
      context: ./fast_api
    container_name: fastapi_app
    expose:
      - 8000

  flask:
    build:
      context: ./flask_api
    container_name: flask_app
    expose:
      - 5000

  nginx:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    ports:
      - "85:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi
      - flask
